<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a crew | Rackcrew</title>
<meta name="description" content="Describe your data center build and put together the crew for it, person by person or as a ready-made crew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
:root{
  --maroon:#3A1418; --maroon-2:#5A262C; --ink:#2B1013; --ink-2:#6B4A47;
  --paper:#FFF8F1; --card:#FFFFFF; --line:#EEDFD2; --soft:#F7ECE1;
  --turbine:#E2A13A; --electrical:#B3141C; --hvac:#E5793D; --networks:#2E3A6E;
  --ok:#2F7A55; --warn:#A35A00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque','Arial Narrow',sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turbine);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.condensed{font-weight:800;font-stretch:75%;letter-spacing:-.02em;line-height:.92}

/* top */
.top{background:var(--maroon);color:#FBEBDC}
.top nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{font-weight:800;font-stretch:75%;font-size:30px;text-decoration:none;letter-spacing:-.01em}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:14px}
.steps li{padding:6px 12px;border-radius:999px;border:1.5px solid var(--maroon-2);color:#D9B9AC;white-space:nowrap}
.steps li.on{background:#FBEBDC;color:var(--maroon);border-color:#FBEBDC;font-weight:700}
.steps li.done{color:#FBEBDC;border-color:#8B4A50}
.hero{padding:28px 0 36px}
.hero h1{font-size:clamp(44px,8vw,92px);max-width:11ch}
.hero p{margin-top:14px;color:#E8CDBF;max-width:34em;font-size:19px}

/* describe box */
.ask{margin-top:26px;background:#FBEBDC;color:var(--ink);border-radius:24px;padding:16px;box-shadow:0 18px 40px -24px #000}
.ask label{display:block;font-weight:700;font-size:15px;color:var(--ink-2);margin:2px 4px 8px}
.ask-row{display:flex;gap:10px;align-items:flex-end}
.ask textarea{flex:1;min-height:58px;max-height:160px;resize:vertical;border:0;background:#fff;border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.35}
.ask textarea::placeholder{color:#A08A84}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:0;background:var(--maroon);color:#FBEBDC;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.light{background:#fff;color:var(--maroon);border:1.5px solid var(--line)}
.btn.gold{background:var(--turbine);color:#3A1A0C}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.ask-try{display:flex;flex-wrap:wrap;gap:8px;margin:12px 4px 2px;font-size:14px;color:var(--ink-2)}
.ask-try button{border:1px dashed #C9A99A;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
.understood{margin-top:14px;padding:12px 4px 2px;border-top:1px solid #EBD3C3}
.understood .lead{font-size:14px;color:var(--ink-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:15px}
.chip b{font-weight:700}
.chip button{width:24px;height:24px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;line-height:1;font-size:15px;color:var(--ink-2)}
.chip.trade{color:#fff;border-color:transparent}

/* mode tabs */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 8px}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:20px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode[aria-pressed="true"]{border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon) inset}
.mode .t{font-weight:800;font-stretch:80%;font-size:22px;line-height:1.05}
.mode .d{font-size:15px;color:var(--ink-2);margin-top:4px}
.mode .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft)}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px 8px 8px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.fbtn .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.fbtn[aria-pressed="true"]{color:#fff;border-color:transparent}
.fbtn.plain{padding:8px 16px}
.count{font-size:15px;color:var(--ink-2);margin:2px 0 14px}

/* person cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.picked{border-color:var(--maroon);box-shadow:0 0 0 1.5px var(--maroon) inset}
.who{display:flex;gap:14px;align-items:center}
.ava{position:relative;flex:none;width:68px;height:68px}
.ava svg.face{width:68px;height:68px;border-radius:50%;display:block}
.ava .badge{position:absolute;right:-4px;bottom:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff}
.who h3{font-size:20px;font-weight:800;font-stretch:85%;line-height:1.1}
.who .role{font-size:15px;color:var(--ink-2)}
.who .meta{font-size:14px;color:var(--ink-2);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);color:#5A3A36}
.tag.hit{background:#E9F3EC;color:var(--ok);font-weight:700}
.past{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.past li{display:flex;gap:10px}
.past li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;margin-top:7px;background:var(--line)}
.past .y{color:var(--ink-2);margin-left:auto;padding-left:8px;white-space:nowrap;font-size:14px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px;border-top:1px solid var(--soft)}
.rate{font-weight:800;font-size:22px;font-stretch:85%}
.rate small{font-weight:500;font-size:14px;color:var(--ink-2);font-stretch:100%}
.avail{font-size:14px}
.avail.ok{color:var(--ok)} .avail.late{color:var(--warn)}
.sec{font-size:13px;font-weight:700;color:var(--ink-2)}

/* crews */
.crew{background:var(--card);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.crew-top{padding:18px;color:#fff}
.crew-top .phase{font-size:14px;opacity:.9}
.crew-top h3{font-size:32px;margin-top:4px}
.stack{display:flex;margin-top:14px}
.stack .ava{width:46px;height:46px;margin-right:-10px}
.stack .ava svg.face{width:46px;height:46px;border:3px solid rgba(255,255,255,.9)}
.crew-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.mix{display:flex;flex-wrap:wrap;gap:6px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,248,241,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s ease}
.bar.show{transform:none}
.bar:not(.show){visibility:hidden}
.bar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .stack{margin:0}
.bar .stack .ava{width:38px;height:38px}
.bar .stack .ava svg.face{width:38px;height:38px;border-color:#fff}
.bar .sum{flex:1;min-width:0;font-size:15px;line-height:1.25}
.bar .sum b{font-size:17px}
main{padding-bottom:120px}

/* schedule */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input,.field select,.field textarea{min-height:48px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff}
.field textarea{min-height:96px;resize:vertical}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--soft)}
.row:first-child{border-top:0}
.row .ava{width:46px;height:46px}
.row .ava svg.face{width:46px;height:46px}
.row .ava .badge{width:22px;height:22px;border-width:2px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:17px}
.row .nm span{font-size:14px;color:var(--ink-2)}
.row .r{text-align:right;font-size:15px;white-space:nowrap}
.rm{border:0;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:underline;font-size:14px;padding:4px}
.total{display:grid;gap:8px;font-size:16px}
.total div{display:flex;justify-content:space-between;gap:10px}
.total .big{font-weight:800;font-stretch:85%;font-size:30px;padding-top:8px;border-top:1.5px solid var(--line)}
.note{font-size:14px;color:var(--ink-2)}
.warnbox{background:#FFF1DE;border-radius:14px;padding:10px 14px;font-size:15px;color:#6E3D00}
.okbox{background:#E9F3EC;border-radius:14px;padding:10px 14px;font-size:15px;color:#1F5A3D}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--maroon);color:#FBEBDC;border-color:var(--maroon)}
.h2{font-size:clamp(34px,5vw,56px)}
.sample{font-size:13px;color:var(--ink-2);text-align:center;padding:28px 0 0}
.done-hero{background:var(--maroon);color:#FBEBDC;border-radius:28px;padding:32px 22px}
.next{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.next li{display:flex;gap:12px;align-items:flex-start}
.next .n{flex:none;width:32px;height:32px;border-radius:50%;background:#FBEBDC;color:var(--maroon);display:grid;place-items:center;font-weight:800}
.empty{padding:28px;border:1.5px dashed var(--line);border-radius:22px;text-align:center;color:var(--ink-2)}

@media (max-width:760px){
  .steps li:not(.on){display:none}
  .modes{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .two .panel{position:static!important}
  .ask-row{flex-direction:column;align-items:stretch}
  .hero{padding-bottom:28px}
  .bar .stack{display:none}
}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const fmt=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtLong=d=>d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const iso=d=>d.toISOString().slice(0,10);
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const availDate=p=>addDays(today,p.availIn);
const placeOf=base=>PLACES.find(pl=>pl.name===base||pl.keys.some(k=>base.toLowerCase().includes(k)))?.name||base;

function lev(a,b){const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n];}

function tradeIcon(t,size=16,stroke="#fff"){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[t]}</svg>`;}

  if(p.hat==="bun") hat=`<circle cx="31" cy="20" r="7" fill="#1E120C"/><path d="M27 38C25 24 38 21 53 28C47 26 39 28 34 35Z" fill="#1E120C"/>`;
  return `<svg class="face" viewBox="0 0 80 80" role="img" aria-label="Illustrated portrait of ${esc(p.name)}"><defs><clipPath id="${id}"><circle cx="40" cy="40" r="40"/></clipPath></defs><g clip-path="url(#${id})">
  <rect width="80" height="80" fill="${T.color}"/><rect y="56" width="80" height="24" fill="${shade(T.color,-0.15)}"/>
  <path d="M10 82C12 62 68 62 70 82Z" fill="${shirt}"/><path d="M10 82C12 62 24 62 26 82Z" fill="${shade(shirt,-0.15)}"/>
  <path d="M15 72L65 70L66 74L15 76Z" fill="${band}"/>

  <ellipse cx="47" cy="39" rx="1.7" ry="2" fill="#1E0F0A"/><path d="M45 46Q48 47.5 51 46" stroke="${skinD}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  ${hat}</g></svg>`;
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt))); return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");}
function ava(p){const T=TRADES[p.trade]; return `<span class="ava">${face(p)}<span class="badge" style="background:${T.color}" title="${esc(T.name)}">${tradeIcon(p.trade,14,T.ink==="#FFFFFF"?"#fff":T.ink)}</span></span>`;}

/* ---------- the describe-it parser ---------- */
const EXAMPLES = [
  "I'm building a data center in Phoenix, Arizona and need a GPU chipset expert who has done it before, starting next month",
  "Liquid cooling crew for 2,000 racks in Dallas, ASAP",
  "Need switchgear techs and a commissioning engineer in Abilene in 3 weeks"
];
function parse(text){
  const t=" "+text.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9,\-' ]/g," ")+" ";
  const words=t.split(/[\s,]+/).filter(Boolean);
  const out={location:null,trades:new Set(),specs:new Set(),start:null,startLabel:null,veteran:false,phase:null};
  // location: exact keys, then fuzzy (handles "Phenix")
  for(const pl of PLACES){ if(pl.keys.some(k=>k.length>2 ? t.includes(" "+k+" ")||t.includes(" "+k+",") : new RegExp("\\b"+k+"\\b").test(t))){out.location=pl.name;break;} }
  if(!out.location){ outer: for(const w of words){ if(w.length<5) continue; for(const pl of PLACES){ for(const k of pl.keys){ if(k.length>=5 && lev(w,k)<=2){out.location=pl.name;break outer;} } } } }
  // specialties and trades
  for(const s of SPECIALTIES){ if(s.words.some(w=>w.includes(" ")? t.includes(w) : words.some(x=>x===w||(w.length>4&&lev(x,w)<=1)))){ out.specs.add(s.id); if(s.trade) out.trades.add(s.trade);} }
  if(/\b(electric|electrical|electrician)/.test(t)) out.trades.add("electrical");
  if(/\b(hvac|cooling|mechanical)/.test(t)) out.trades.add("hvac");
  if(/\b(network|networking|it )/.test(t)) out.trades.add("networks");
  if(/\b(power|turbine|genset|generator)/.test(t)) out.trades.add("turbine");
  // a generic word like "cooling" shouldn't also add chillers when liquid was asked for
  if(out.specs.has("liquid")) out.specs.delete("chiller");
  if(out.specs.has("gpu")) out.specs.delete("rack");
  // start date
  let m;
  if(/\b(asap|immediately|right away|right now|this week|urgent)\b/.test(t)){out.start=addDays(today,3);out.startLabel="As soon as possible";}
  else if(/\bnext month\b/.test(t)){const d=new Date(today.getFullYear(),today.getMonth()+1,1);out.start=d;out.startLabel="Next month ("+fmt(d)+")";}
  else if(/\bnext week\b/.test(t)){out.start=addDays(today,7);out.startLabel="Next week";}
  else if((m=t.match(/\bin (\d+|two|three|four|six) (week|weeks|month|months)\b/))){const num={two:2,three:3,four:4,six:6}[m[1]]||+m[1]; const days=m[2].startsWith("week")?num*7:num*30; out.start=addDays(today,days); out.startLabel="In "+num+" "+m[2]+" ("+fmt(out.start)+")";}
  else { const months=["january","february","march","april","may","june","july","august","september","october","november","december"];
    for(let i=0;i<12;i++){ if(new RegExp("\\b("+months[i]+"|"+months[i].slice(0,3)+")\\b").test(t) && !(months[i]==="may"&&/\bmay (need|want|be)\b/.test(t))){ let y=today.getFullYear(); if(i<today.getMonth()) y++; out.start=new Date(y,i,1); out.startLabel=months[i][0].toUpperCase()+months[i].slice(1)+" "+y; break; } } }
  // experience
  if(/(done (it|this|one|that) before|has done|have done|experience|experienced|veteran|proven|before\b|track record|been there)/.test(t)) out.veteran=true;
  // phase guess for ready crews
  if(out.specs.has("gpu")||out.specs.has("rack")||out.specs.has("fiber")) out.phase="gpu";
  else if(out.specs.has("liquid")||out.specs.has("chiller")) out.phase="cooling";
  else if(out.specs.has("substation")) out.phase="grid";
  else if(out.specs.has("switchgear")) out.phase="fitout";
  else if(out.specs.has("turbines")||out.specs.has("gensets")) out.phase="power";
  else if(out.specs.has("commission")) out.phase="cx";
  return out;
}

/* ---------- state ---------- */
const S = {
  step:"who", mode:"browse", text:"", parsed:null,
  trades:new Set(), specs:new Set(), location:null, start:null, startLabel:null, veteran:false, phase:null,
  cart:[], crew:null, weeks:12, form:{}
};
// deep link: /request?trade=electrical or ?mode=crews
const qs=new URLSearchParams(location.search);
if(qs.get("trade")&&TRADES[qs.get("trade")]) S.trades.add(qs.get("trade"));
if(qs.get("mode")==="crews") S.mode="crews";

function applyParsed(p){
  S.parsed=p; S.trades=new Set(p.trades); S.specs=new Set(p.specs); S.location=p.location;
  S.start=p.start; S.startLabel=p.startLabel; S.veteran=p.veteran; if(p.phase) S.phase=p.phase;
}

function score(p){
  let s=0; const reasons=[];
  if(S.trades.size && !S.trades.has(p.trade) && ![...S.specs].some(id=>p.spec.includes(id))) return null;
  const hits=[...S.specs].filter(id=>p.spec.includes(id));
  if(S.specs.size && !hits.length && S.trades.size===0) return null;
  s+=hits.length*10;
  if(S.location){ if(placeOf(p.base)===S.location){s+=8; reasons.push("local");} }
  if(S.veteran){ if(p.builds>=3){s+=6;} else s-=6; }
  if(S.start){ if(availDate(p)<=S.start) s+=4; }
  s+=Math.min(p.builds,6);
  return {s,hits};
}

  const order=[["who","Who"],["when","When and rate"],["confirm","Confirm"]];
  const i=order.findIndex(o=>o[0]===S.step);

}

function render(){
  setSteps();
  if(S.step==="who") renderWho();
  if(S.step==="when") renderWhen();
  if(S.step==="confirm") renderConfirm();
  if(S.step==="sent") renderSent();
  renderBar();
}

function understoodHTML(){
  const chips=[];
  if(S.location) chips.push(`<span class="chip"><span>Site</span><b>${esc(S.location)}</b><button type="button" data-drop="loc:" aria-label="Remove site">×</button></span>`);

  if(S.veteran) chips.push(`<span class="chip"><b>Has done this build before</b><button type="button" data-drop="vet:" aria-label="Remove">×</button></span>`);
  return `<div class="understood"><div class="lead">${chips.length?"Here’s what we understood. Remove anything that’s off.":"We couldn’t pick out a trade, place or date. Try naming the work, the city and when you need people."}</div><div class="chips">${chips.join("")}</div></div>`;
}

  document.querySelectorAll("[data-crew]").forEach(b=>b.addEventListener("click",()=>{S.crew=b.dataset.crew; S.cart=[...CREWS.find(c=>c.id===S.crew).members]; S.step="when"; render(); window.scrollTo(0,0);}));
}
function crewRate(c){ const named=c.members.reduce((s,id)=>s+byId[id].rate,0); const extraN=c.size-c.members.length; const avg=c.phase==="grid"?84:c.phase==="fitout"?66:62; return named+extraN*avg; }
function crewCard(c){
  const ph=PHASES.find(p=>p.id===c.phase); const T=ph.trade?TRADES[ph.trade]:{color:"#3A1418",ink:"#FBEBDC"};
  const trades=[...new Set(c.members.map(id=>byId[id].trade))];
  const d=addDays(today,c.availIn); const late=S.start?daysBetween(S.start,d):0;
  return `<article class="crew">
    <div class="crew-top" style="background:${T.color};color:${T.ink}">
      <div class="phase">${esc(ph.name)}, based in ${esc(c.base)}</div>
      <h3 class="condensed">${esc(c.name)}</h3>
      <div class="stack">${c.members.map(id=>ava(byId[id])).join("")}</div>
    </div>
    <div class="crew-body">
      <p>${esc(c.blurb)}</p>
      <div class="facts"><span class="tag">${c.size} people</span><span class="tag">${c.builds} builds together</span>${c.extra?`<span class="tag">${esc(c.extra)}</span>`:""}</div>
      <div><div class="sec">Led by</div><div style="display:flex;align-items:center;gap:10px;margin-top:6px">${miniAva(byId[c.members[0]])}<span><b>${esc(byId[c.members[0]].name)}</b>, ${esc(byId[c.members[0]].role.toLowerCase())}</span></div></div>
      <div class="mix">${trades.map(t=>`<span class="tag" style="display:inline-flex;gap:6px;align-items:center"><span style="width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:${TRADES[t].color}">${tradeIcon(t,11,TRADES[t].ink)}</span>${TRADES[t].short}</span>`).join("")}</div>
      <div class="card-foot"><div><div class="rate">${money(crewRate(c)*HOURS)}<small> /week</small></div>${S.start&&late>0?`<span class="avail late">Free from ${fmt(d)}, ${late} days after your start</span>`:`<span class="avail ok">Free from ${fmt(d)}</span>`}</div>
      <button class="btn" type="button" data-crew="${c.id}">Pick this crew</button></div>
    </div>
  </article>`;
}
function miniAva(p){return `<span class="ava" style="width:34px;height:34px">${face(p).replace('class="face"','class="face" style="width:34px;height:34px"')}</span>`;}

function renderBar(){
  const bar=$("#bar");
  if(S.step!=="who"||!S.cart.length||S.crew){ bar.classList.remove("show"); bar.innerHTML=""; return; }
  const ppl=S.cart.map(id=>byId[id]); const wk=ppl.reduce((s,p)=>s+p.rate,0)*HOURS;
  bar.innerHTML=`<div class="in"><div class="stack">${ppl.slice(0,5).map(ava).join("")}</div>
    <div class="sum"><b>${ppl.length} in your crew</b><br>${money(wk)} a week at ${HOURS} hrs</div>
    <button class="btn" type="button" id="toWhen">Next: when and rate</button></div>`;
  bar.classList.add("show");
  $("#toWhen").addEventListener("click",()=>{S.step="when"; render(); window.scrollTo(0,0);});
}

/* step 2 */
function members(){ return S.cart.map(id=>byId[id]); }
function renderWhen(){
  const crew=S.crew?CREWS.find(c=>c.id===S.crew):null;
  if(!S.start) S.start=addDays(today,14);
  $("#hero").innerHTML=`<div class="hero"><h1 class="condensed">When do you need them?</h1><p>${crew?`Crew ${esc(crew.name)}, ${crew.size} people.`:`${S.cart.length} ${S.cart.length===1?"person":"people"} in your crew.`} Check dates and rates before you send the request.</p></div>`;
  const ppl=members();
  const late=ppl.filter(p=>availDate(p)>S.start);
  const rateSum=ppl.reduce((s,p)=>s+p.rate,0)+(crew?(crewRate(crew)-ppl.reduce((s,p)=>s+p.rate,0)):0);
  const weekly=rateSum*HOURS, total=weekly*S.weeks;
  const earliest=new Date(Math.max(...ppl.map(p=>+availDate(p)), crew?+addDays(today,crew.availIn):0));
  $("#app").innerHTML=`<div class="two" style="margin-top:22px">
    <div class="panel">
      <div class="field"><label for="start">Start date on site</label><input id="start" type="date" value="${iso(S.start)}" min="${iso(today)}"></div>
      <div class="field" style="margin-top:16px"><span style="font-weight:700;font-size:15px" id="lenL">How long</span>
        <div class="seg" role="group" aria-labelledby="lenL">${[4,8,12,26].map(w=>`<button type="button" data-w="${w}" aria-pressed="${S.weeks===w}">${w===26?"6 months":w+" weeks"}</button>`).join("")}</div></div>
      <div style="margin-top:18px">${late.length?`<div class="warnbox">${late.length===1?esc(late[0].name)+" is":late.length+" people are"} free a little after your start. <button type="button" class="rm" id="shift" style="color:#6E3D00">Start on ${fmt(earliest)} instead</button>${S.crew?"":" or swap them out."}</div>`:`<div class="okbox">Everyone is free for a ${fmtLong(S.start)} start.</div>`}</div>
      <div style="margin-top:8px">${ppl.map(p=>`<div class="row">${ava(p)}<div class="nm"><b>${esc(p.name)}</b><span>${esc(p.role)}</span><br>${availHTML(p)}</div><div class="r"><b>${money(p.rate)}</b>/hr${S.crew?"":`<br><button type="button" class="rm" data-rm="${p.id}">Remove</button>`}</div></div>`).join("")}
      ${crew&&crew.extra?`<div class="row"><span class="ava" style="width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800">+${crew.size-crew.members.length}</span><div class="nm"><b>${esc(crew.extra[0].toUpperCase()+crew.extra.slice(1))}</b><span>Regulars on this crew</span></div><div class="r"><b>${money((crewRate(crew)-ppl.reduce((s,p)=>s+p.rate,0)))}</b>/hr total</div></div>`:""}</div>
    </div>
    <div class="panel" style="position:sticky;top:12px">
      <div class="total">
        <div><span>Crew rate</span><b>${money(rateSum)}/hr</b></div>
        <div><span>Per week, ${HOURS} hrs</span><b>${money(weekly)}</b></div>
        <div><span>Length</span><b>${S.weeks===26?"6 months":S.weeks+" weeks"}</b></div>
        <div class="big"><span>Estimate</span><span>${money(total)}</span></div>
      </div>
      <p class="note" style="margin-top:10px">Bill rates include payroll, insurance and Rackcrew’s fee. Overtime, per diem and travel are quoted once the crew confirms.</p>
      <div style="display:grid;gap:10px;margin-top:16px">
        <button class="btn" type="button" id="toConfirm" ${ppl.length?"":"disabled"}>Next: confirm</button>
        <button class="btn light" type="button" id="back">Back to ${S.crew?"crews":"people"}</button>
      </div>
    </div>
  </div>`;
  $("#start").addEventListener("change",e=>{ if(e.target.value){S.start=new Date(e.target.value+"T00:00"); S.startLabel=null;} render(); });
  document.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{S.weeks=+b.dataset.w; render();}));
  document.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{S.cart=S.cart.filter(x=>x!==b.dataset.rm); if(!S.cart.length){S.step="who";} render();}));
  $("#shift")?.addEventListener("click",()=>{S.start=earliest; render();});
  $("#toConfirm").addEventListener("click",()=>{S.step="confirm"; render(); window.scrollTo(0,0);});
  $("#back").addEventListener("click",()=>{ if(S.crew){S.cart=[];S.crew=null;S.mode="crews";} S.step="who"; render(); window.scrollTo(0,0);});
}

/* step 3 */
function renderConfirm(){
  const crew=S.crew?CREWS.find(c=>c.id===S.crew):null; const ppl=members();
  const rateSum=crew?crewRate(crew):ppl.reduce((s,p)=>s+p.rate,0); const total=rateSum*HOURS*S.weeks;
  $("#hero").innerHTML=`<div class="hero"><h1 class="condensed">Send the request.</h1><p>Each person confirms the dates and rate. Nothing is booked or charged until they do.</p></div>`;
  const f=S.form;
  $("#app").innerHTML=`<div class="two" style="margin-top:22px">
    <form class="panel" id="cform" novalidate>
      <div style="display:grid;gap:14px">
        <div class="field"><label for="fn">Your name</label><input id="fn" name="name" autocomplete="name" required value="${esc(f.name||"")}"></div>
        <div class="field"><label for="fc">Company</label><input id="fc" name="company" autocomplete="organization" required value="${esc(f.company||"")}"></div>
        <div class="field"><label for="fe">Work email</label><input id="fe" name="email" type="email" autocomplete="email" required value="${esc(f.email||"")}"></div>
        <div class="field"><label for="fs">Site location</label><input id="fs" name="site" required value="${esc(f.site||S.location||"")}" placeholder="City, state"></div>
        <div class="field"><label for="fx">Anything the crew should know</label><textarea id="fx" name="notes" placeholder="Badging, site hours, union or open shop, per diem">${esc(f.notes||S.text||"")}</textarea></div>
        <p id="ferr" class="warnbox" hidden></p>
        <button class="btn gold" type="submit" style="min-height:56px;font-size:18px">Send crew request</button>
        <button class="btn light" type="button" id="back2">Back</button>
      </div>
    </form>
    <div class="panel">
      <div class="sec">Your crew</div>
      <div style="margin-top:6px">${crew?`<p style="font-weight:800;font-stretch:85%;font-size:24px">${esc(crew.name)}</p>`:""}${ppl.map(p=>`<div class="row">${ava(p)}<div class="nm"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div><div class="r">${money(p.rate)}/hr</div></div>`).join("")}${crew&&crew.extra?`<div class="row"><div class="nm"><b>${esc(crew.extra[0].toUpperCase()+crew.extra.slice(1))}</b></div></div>`:""}</div>
      <div class="total" style="margin-top:10px">
        <div><span>Starts</span><b>${fmtLong(S.start)}</b></div>
        <div><span>Length</span><b>${S.weeks===26?"6 months":S.weeks+" weeks"}</b></div>
        <div class="big"><span>Estimate</span><span>${money(total)}</span></div>
      </div>
    </div>
  </div>`;
  const form=$("#cform");
  form.addEventListener("input",e=>{ if(e.target.name) S.form[e.target.name]=e.target.value; });
  form.addEventListener("submit",e=>{ e.preventDefault(); const bad=[...form.querySelectorAll("[required]")].filter(i=>!i.value.trim()||(i.type==="email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value)));
    const err=$("#ferr"); if(bad.length){ err.hidden=false; err.textContent="Add your "+bad.map(i=>form.querySelector(`label[for=${i.id}]`).textContent.toLowerCase().replace(/^your /,"")).join(", ")+" so we can send this."; bad[0].focus(); return; }
    S.step="sent"; render(); window.scrollTo(0,0); });
  $("#back2").addEventListener("click",()=>{S.step="when"; render(); window.scrollTo(0,0);});
}
function renderSent(){
  const crew=S.crew?CREWS.find(c=>c.id===S.crew):null; const ppl=members();
  $("#hero").innerHTML="";
  $("#app").innerHTML=`<div style="max-width:640px;margin:28px auto 0">
    <div class="done-hero">
      <div class="stack" style="margin:0 0 18px">${ppl.slice(0,6).map(ava).join("")}</div>
      <h1 class="condensed" style="font-size:clamp(44px,8vw,72px)">Request sent.</h1>
      <p style="margin-top:12px;color:#E8CDBF">${crew?`Crew ${esc(crew.name)} has`:`${ppl.length} ${ppl.length===1?"person has":"people have"}`} your dates. We’ll email ${esc(S.form.email||"you")} as each one confirms.</p>
      <ol class="next">
        <li><span class="n">1</span><span>Each crew member confirms dates and rate, usually within 48 hours.</span></li>
        <li><span class="n">2</span><span>You get one contract for the whole crew. We carry payroll and insurance.</span></li>
        <li><span class="n">3</span><span>The crew shows up on ${fmtLong(S.start)}, badged and ready.</span></li>
      </ol>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px"><a class="btn" href="/">Back to Rackcrew</a><button class="btn light" type="button" id="again">Request another crew</button></div>
    <p class="sample">This preview doesn’t send anything yet.</p>
  </div>`;
  $("#again").addEventListener("click",()=>{ Object.assign(S,{step:"who",cart:[],crew:null,parsed:null,text:"",form:{}}); S.trades.clear(); S.specs.clear(); S.location=null; S.start=null; S.startLabel=null; S.veteran=false; S.phase=null; render(); window.scrollTo(0,0);});
}

function iconCart(){return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A1418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.6 3-5.6 6-5.6s5.4 2 6 5.6"/><path d="M18 7v6M15 10h6"/></svg>`;}
function iconCrew(){return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A1418" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="8" r="2.6"/><circle cx="17" cy="8" r="2.6"/><circle cx="12" cy="6" r="2.8"/><path d="M2.5 19c.4-3 2.2-4.6 4.5-4.6M21.5 19c-.4-3-2.2-4.6-4.5-4.6M7 20c.5-3.4 2.5-5.4 5-5.4s4.5 2 5 5.4"/></svg>`;}

render();
})();
</script>
</body>
</html>
